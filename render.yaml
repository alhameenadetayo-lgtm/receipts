# Render blueprint: New > Blueprint, pick this repo. Creates the API and its Postgres.
# Free Postgres expires after 30 days: upgrade it before judging ends.
services:
  - type: web
    name: receipts-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: receipts-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: receipts-db
    plan: free
    databaseName: receipts
